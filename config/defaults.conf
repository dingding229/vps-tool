# vps-tool 默认配置
APP_NAME="VPS Tool"
APP_VERSION="0.7.0"
APP_TIMEZONE="Asia/Shanghai"
APP_TIMEZONE_LABEL="北京时间"

# 自动更新
UPDATE_ENABLED="yes"
UPDATE_REPO_OWNER="dingding229"
UPDATE_REPO_NAME="vps-tool"
UPDATE_REPO_BRANCH="main"
UPDATE_CONNECT_TIMEOUT=8
UPDATE_MAX_TIME=20
UPDATE_DOWNLOAD_MAX_TIME=120

# APT 软件包检查
APT_LOCK_TIMEOUT=15
APT_PACKAGE_PREVIEW_LIMIT=8

# SSH
SSH_PORT_MIN=20000
SSH_PORT_MAX=50000
SSH_TARGET_USER="root"
SSH_ALLOW_ROOT_KEY_LOGIN="yes"
SSH_ROLLBACK_TIMEOUT=300
SSH_DROPIN_FILE="/etc/ssh/sshd_config.d/00-vps-tool.conf"
ROOT_SSH_DROPIN_FILE="/etc/ssh/sshd_config.d/00-00-vps-tool-root-access.conf"
SSHD_MAIN_CONFIG="/etc/ssh/sshd_config"

# Fail2ban
FAIL2BAN_MAXRETRY=5
FAIL2BAN_FINDTIME="10m"
FAIL2BAN_BANTIME="1h"
FAIL2BAN_MAX_BANTIME="7d"
FAIL2BAN_LOG_FILE="/var/log/fail2ban.log"
FAIL2BAN_DEFAULT_LINES=50
FAIL2BAN_DEFAULT_JAIL="sshd"
FAIL2BAN_LOG_RETENTION_DAYS=14

# vnStat
VNSTAT_HOUR_LIMIT=24
VNSTAT_DAY_LIMIT=30
VNSTAT_MONTH_LIMIT=12
VNSTAT_TOP_LIMIT=10

# BBRv3
BBR_INSTALLER_URL="https://raw.githubusercontent.com/byJoey/Actions-bbr-v3/main/install.sh"
BBR_REPOSITORY_URL="https://github.com/byJoey/Actions-bbr-v3"
BBR_REBOOT_DELAY=8

# 运行目录
APP_ETC_DIR="/etc/vps-tool"
APP_STATE_DIR="/var/lib/vps-tool"
APP_BACKUP_DIR="/var/backups/vps-tool"
APP_LOG_DIR="/var/log/vps-tool"
APP_LOG_FILE="/var/log/vps-tool/install.log"
APP_LOCK_FILE="/run/lock/vps-tool.lock"
SSH_ROLLBACK_STATE="/run/vps-tool-ssh-rollback.env"
SSH_ROLLBACK_UNIT="vps-tool-ssh-rollback"
